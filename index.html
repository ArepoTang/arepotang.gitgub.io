<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TENET</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, 'Helvetica Neue', 'PingFang SC', 'Noto Sans SC', sans-serif;
  -webkit-font-smoothing: antialiased;
}
#canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ===== UI 左下角堆叠（右边界给右下角按钮让位，窄屏就换行变高）===== */
#ui {
  position: fixed;
  left: 24px;
  right: 96px;
  bottom: 28px;
  max-width: 420px;
  color: rgba(255,255,255,0.85);
  opacity: 0;
  transform: translateY(-12px);
  transition: opacity 0.8s ease-out 0.2s, transform 0.8s ease-out 0.2s;
  pointer-events: none;
  z-index: 10;
  user-select: none;
}
#ui.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
#ui .name {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 3px;
  margin-bottom: 5px;
  line-height: 1.2;
}
#ui .tagline {
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 1.5px;
  opacity: 0.5;
  margin-bottom: 0;
  line-height: 1.45;
  overflow-wrap: break-word;
}

/* ===== 悬浮按钮 右下角 ===== */
#float-btn {
  position: fixed;
  right: 22px;
  bottom: 22px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  cursor: pointer;
  opacity: 0;
  transform: translateY(-12px);
  transition:
    opacity 0.8s ease-out 0.3s,
    transform 0.8s ease-out 0.3s,
    background 0.3s,
    border-color 0.3s,
    box-shadow 0.3s;
  z-index: 10;
  pointer-events: none;
  padding: 0;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
#float-btn.visible {
  opacity: 0.5;
  transform: translateY(0);
  pointer-events: auto;
}
#float-btn:hover {
  opacity: 1 !important;
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.4);
  box-shadow: 0 0 20px rgba(255,255,255,0.08);
}
/* 汉堡包图标（三横）*/
#float-btn::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 16px;
  height: 1.5px;
  border-radius: 2px;
  background: rgba(255,255,255,0.7);
  box-shadow: 0 -5.5px 0 rgba(255,255,255,0.7), 0 5.5px 0 rgba(255,255,255,0.7);
  transform: translate(-50%, -50%);
  transition: background 0.3s, box-shadow 0.3s;
}
#float-btn:hover::after {
  background: rgba(255,255,255,0.95);
  box-shadow: 0 -5.5px 0 rgba(255,255,255,0.95), 0 5.5px 0 rgba(255,255,255,0.95);
}

/* ===== 磨砂弹窗（居中 + 右上角关闭）===== */
#modal {
  position: fixed;
  inset: 0;
  z-index: 30;
}
#modal.hide { display: none; }

#modal .modal-panel {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(420px, calc(100vw - 48px));
  max-height: min(72vh, 560px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 26px 24px 20px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(18,22,30,0.5);
  -webkit-backdrop-filter: blur(18px) saturate(0.9);
  backdrop-filter: blur(18px) saturate(0.9);
  box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.96);
  transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.2,.8,.25,1);
}
#modal.show .modal-panel {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

#modal-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  padding: 0;
  outline: none;
  cursor: pointer;
  transition: background 0.25s;
  -webkit-tap-highlight-color: transparent;
}
#modal-close::before,
#modal-close::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 13px;
  height: 1.5px;
  border-radius: 2px;
  background: rgba(255,255,255,0.6);
  transition: background 0.25s;
}
#modal-close::before { transform: translate(-50%, -50%) rotate(45deg); }
#modal-close::after  { transform: translate(-50%, -50%) rotate(-45deg); }
#modal-close:hover { background: rgba(255,255,255,0.08); }
#modal-close:hover::before,
#modal-close:hover::after { background: rgba(255,255,255,0.95); }

.modal-title {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 12px;
}
.modal-title[hidden] { display: none; }
#modal-list { list-style: none; }
#modal-list a {
  display: block;
  padding: 12px;
  margin: 0 -12px;
  border-radius: 12px;
  color: rgba(255,255,255,0.88);
  text-decoration: none;
  transition: background 0.25s;
}
#modal-list a:hover { background: rgba(79,195,247,0.1); }
#modal-list .item-name { font-size: 15px; letter-spacing: 0.5px; line-height: 1.6; }
#modal-list .item-desc {
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,0.4);
  margin-top: 3px;
}

/* ===== 开屏引导：黑磨砂 + 蓝色星星指示 + 底部按钮 ===== */
#guide {
  position: fixed;
  inset: 0;
  z-index: 20;
}
#guide.hide { display: none; }

/* ===== 磨砂层（开屏引导 / 弹窗共用）===== */
.frost {
  position: absolute;
  inset: 0;
  background: rgba(3,5,9,0.62);
  -webkit-backdrop-filter: blur(16px) saturate(0.7);
  backdrop-filter: blur(16px) saturate(0.7);
  opacity: 0;
  transition: opacity 0.9s ease;
}
#guide.show .frost,
#modal.show .frost { opacity: 1; }
#modal .frost { transition-duration: 0.35s; }

#markers {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.9s ease 0.45s;
  pointer-events: none;
}
#guide.show #markers { opacity: 1; }

/* 蓝色星星指示点 */
.spot {
  position: absolute;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
}
.spot::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: #4FC3F7;
  box-shadow: 0 0 14px #4FC3F7, 0 0 34px rgba(79,195,247,0.75);
}
.spot::after {
  content: '';
  position: absolute;
  inset: -9px;
  border-radius: 50%;
  border: 1px solid rgba(79,195,247,0.6);
  animation: spotPulse 2.4s ease-out infinite;
}
@keyframes spotPulse {
  0%   { transform: scale(0.6); opacity: 0.9; }
  80%, 100% { transform: scale(2.4); opacity: 0; }
}
/* 主目标：离屏幕中心最近的那颗 */
.spot.main { width: 20px; height: 20px; margin: -10px 0 0 -10px; }
.spot.main::after { inset: -13px; border-color: rgba(79,195,247,0.85); }


/* ===== 项目详情页（锚点 #id）===== */
#page {
  position: fixed;
  inset: 0;
  z-index: 40;
}
#page.hide { display: none; }
#page .frost { transition-duration: 0.35s; }
#page.show .frost { opacity: 1; }

#page-back {
  position: absolute;
  top: 18px;
  left: 18px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.75);
  font-size: 16px;
  line-height: 1;
  font-family: inherit;
  padding: 0;
  cursor: pointer;
  outline: none;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: background 0.25s, border-color 0.25s, color 0.25s;
  -webkit-tap-highlight-color: transparent;
}
#page-back:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.35);
  color: #fff;
}

.page-inner {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 88px 20px calc(44px + env(safe-area-inset-bottom, 0px));
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
#page.show .page-inner {
  opacity: 1;
  transform: none;
}
.page-card {
  position: relative;
  max-width: 620px;
  margin: 0 auto;
  padding: 30px 26px;
  animation: cardIn 0.45s cubic-bezier(.2,.8,.25,1);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
}

/* --- 纸板箱（phi）--- */
#page[data-theme="cardboard"] .page-card {
  border-radius: 4px;
  border: 1px solid rgba(84,58,32,0.35);
  background-image:
    repeating-linear-gradient(90deg, rgba(120,86,52,0.09) 0 1px, transparent 1px 7px),
    linear-gradient(160deg, #cfb086, #b8935f);
  box-shadow: 0 18px 40px rgba(0,0,0,0.5), inset 0 0 60px rgba(97,67,36,0.25);
  color: #4a3520;
}
#page[data-theme="cardboard"] .page-card::before {
  content: '';
  position: absolute;
  top: -13px;
  left: 50%;
  width: 96px;
  height: 26px;
  transform: translateX(-50%) rotate(-2deg);
  background: rgba(240,233,215,0.35);
  border-left: 1px dashed rgba(255,255,255,0.4);
  border-right: 1px dashed rgba(255,255,255,0.4);
}
#page[data-theme="cardboard"] #page-title { color: #38270f; }
#page[data-theme="cardboard"] #page-desc { color: rgba(56,39,15,0.6); }
#page[data-theme="cardboard"] #page-body { color: rgba(56,39,15,0.85); }
#page[data-theme="cardboard"] #page-link {
  border-color: rgba(56,39,15,0.4);
  background: rgba(255,255,255,0.28);
  color: #38270f;
}

/* --- 报纸（epsilon）--- */
#page[data-theme="newspaper"] .page-card {
  border-radius: 2px;
  background: linear-gradient(#f7f2e7, #ebe4d4);
  box-shadow: 0 18px 40px rgba(0,0,0,0.5);
  font-family: Georgia, 'Songti SC', 'Noto Serif SC', serif;
  color: #1c1a16;
}
#page[data-theme="newspaper"] .page-card::before {
  content: '';
  display: block;
  height: 6px;
  margin-bottom: 16px;
  border-top: 1px solid rgba(28,26,22,0.75);
  border-bottom: 1px solid rgba(28,26,22,0.75);
}
#page[data-theme="newspaper"] #page-title {
  padding-bottom: 12px;
  border-bottom: 3px double rgba(28,26,22,0.6);
  font-weight: 700;
  letter-spacing: 1px;
  color: #15130f;
}
#page[data-theme="newspaper"] #page-desc { color: rgba(28,26,22,0.6); }
#page[data-theme="newspaper"] #page-body { color: #2a261f; }
#page[data-theme="newspaper"] #page-link {
  border-color: rgba(28,26,22,0.35);
  background: rgba(28,26,22,0.05);
  color: #15130f;
}

/* --- 半调网罦（lambda）--- */
#page[data-theme="halftone"] .page-card {
  border-radius: 16px;
  border: 1px solid rgba(79,195,247,0.3);
  overflow: hidden;
  background-color: #06080c;
  background-image:
    linear-gradient(rgba(6,8,12,0.72), rgba(6,8,12,0.72)),
    radial-gradient(circle, rgba(79,195,247,0.5) 1px, transparent 1.2px);
  background-size: auto, 5px 5px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.6), inset 0 0 80px rgba(79,195,247,0.06);
  color: #cfe9ff;
}
#page[data-theme="halftone"] .page-card::before {
  content: '';
  display: block;
  height: 52px;
  margin: -30px -26px 18px;
  border-bottom: 1px solid rgba(79,195,247,0.25);
  background-image: radial-gradient(circle, rgba(79,195,247,0.6) 1.5px, transparent 2px);
  background-size: 8px 8px;
}
#page[data-theme="halftone"] #page-title {
  color: #eaf7ff;
  text-shadow: 0 0 18px rgba(79,195,247,0.45);
}
#page[data-theme="halftone"] #page-desc { color: rgba(207,233,255,0.5); }
#page[data-theme="halftone"] #page-body { color: rgba(207,233,255,0.75); }
#page[data-theme="halftone"] #page-link {
  border-color: rgba(79,195,247,0.5);
  background: rgba(79,195,247,0.12);
  color: #dff0ff;
}
#page-title {
  font-size: 30px;
  font-weight: 600;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.92);
}
#page-desc {
  margin-top: 8px;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.45);
}
#page-desc[hidden] { display: none; }
#page-body { color: rgba(255,255,255,0.68); }
#page-body p {
  margin-top: 20px;
  font-size: 14px;
  font-weight: 300;
  line-height: 1.9;
}
#page-body h2 { margin: 28px 0 10px; font-size: 17px; font-weight: 600; letter-spacing: 1px; }
#page-body h3 { margin: 22px 0 8px; font-size: 15px; font-weight: 600; }
#page-body ul, #page-body ol { margin: 16px 0 0 22px; }
#page-body li { margin-top: 6px; font-size: 14px; font-weight: 300; line-height: 1.8; }
#page-body blockquote {
  margin-top: 18px;
  padding-left: 14px;
  border-left: 2px solid currentColor;
  opacity: 0.75;
}
#page-body code {
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(127,127,127,0.2);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.92em;
}
#page-body hr {
  margin: 26px 0;
  border: 0;
  border-top: 1px solid currentColor;
  opacity: 0.25;
}
#page-body a { color: inherit; text-decoration: underline; }
#page-body strong { font-weight: 600; }
#page-link {
  display: inline-block;
  margin-top: 28px;
  padding: 11px 20px;
  border-radius: 999px;
  border: 1px solid rgba(79,195,247,0.4);
  background: rgba(79,195,247,0.08);
  font-size: 13px;
  letter-spacing: 0.5px;
  color: #bfe6ff;
  text-decoration: none;
  word-break: break-all;
  transition: background 0.25s, border-color 0.25s;
}
#page-link:hover {
  background: rgba(79,195,247,0.16);
  border-color: rgba(79,195,247,0.75);
}
#page-link[hidden] { display: none; }

/* ===== 触摸设备：按钮默认可见度稍高 ===== */
@media (hover: none) {
  #float-btn.visible { opacity: 0.55; }
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div class="name">Arepo</div>
  <div class="tagline">We may have knowledge of the past but cannot control it<br>We may control the future but have no knowledge of it</div>
  <!-- 社交链接已移除 -->
</div>

<button id="float-btn" aria-label="菜单"></button>

<div id="modal" class="hide" role="dialog" aria-modal="true">
  <div class="frost"></div>
  <div class="modal-panel">
    <button id="modal-close" aria-label="关闭"></button>
    <div class="modal-title" id="modal-title" hidden></div>
    <ul id="modal-list"></ul>
  </div>
</div>

<div id="guide" class="hide">
  <div class="frost"></div>
  <div id="markers"></div>
</div>

<div id="page" class="hide">
  <div class="frost"></div>
  <button id="page-back" aria-label="返回">←</button>
  <div class="page-inner">
    <article class="page-card">
      <h1 id="page-title"></h1>
      <div id="page-desc" hidden></div>
      <div id="page-body"></div>
      <a id="page-link" hidden target="_blank" rel="noopener"></a>
    </article>
  </div>
</div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const ui = document.getElementById('ui');
  const floatBtn = document.getElementById('float-btn');
  const guide = document.getElementById('guide');
  const markers = document.getElementById('markers');
  const modal = document.getElementById('modal');
  const modalClose = document.getElementById('modal-close');
  const modalTitle = document.getElementById('modal-title');
  const modalList = document.getElementById('modal-list');

  // 汉堡菜单的内容；body 是 Markdown 源码（支持 #标题 / **粗** / *斜* / `代码` / [链接](url) / - 列表 / 1. 列表 / > 引用 / ---）
  const PROJECTS = [
    { id: 'phi',     text: 'phi',     desc: '半调海报 App',    href: 'https://gitee.com/a231216/phi', theme: 'cardboard', body: '' },
    { id: 'lambda',  text: 'lambda',  desc: 'halftone 命令行', href: '', theme: 'halftone', body: '' },
    { id: 'epsilon', text: 'epsilon', desc: 'poster 命令行',   href: '', theme: 'newspaper', body: '' },
  ];

  // 迷你 Markdown → HTML（先转义再替换，不引外部库）
  function md(src) {
    const esc = (s) => s.replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    const out = [];
    let list = '';
    const closeList = () => { if (list) { out.push('</' + list + '>'); list = ''; } };

    for (const raw of src.split('\n')) {
      const line = raw.trim();
      const m = line.match(/^(#{1,4})\s+(.*)$/);
      const ul = line.match(/^[-*+]\s+(.*)$/);
      const ol = line.match(/^\d+\.\s+(.*)$/);
      const bq = line.match(/^>\s?(.*)$/);

      if (!line) { closeList(); }
      else if (m) { closeList(); out.push('<' + 'h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); }
      else if (/^(-{3,}|\*{3,})$/.test(line)) { closeList(); out.push('<hr>'); }
      else if (bq) { closeList(); out.push('<blockquote>' + inline(bq[1]) + '</blockquote>'); }
      else if (ul) {
        if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
        out.push('<li>' + inline(ul[1]) + '</li>');
      } else if (ol) {
        if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
        out.push('<li>' + inline(ol[1]) + '</li>');
      } else {
        closeList();
        out.push('<p>' + inline(line) + '</p>');
      }
    }
    closeList();
    return out.join('');
  }

  // 蓝星彩蛋的池子（每次只抽一条）
  const EGG_LINES = [
    '此处祥和安稳——比最初的时刻热闹了许多。',
    '受邀前来的人们都有着属于自己的一隅之地。有的人乐于精心布置，而有的人更偏好简单朴素。',
    '它曾经历许多，并非一尘不染，但依旧八角硬朗，普通地整洁着。',
    '请进，请进，这里只有你的朋友们。',
    '推开窗子，偶见另一个推窗的人。',
    '选择广播哪种音乐——往往是最易起争端的事项。',
    '值得庆幸，在这里，换一种装潢风格是如此简单。',
    '1999年，归根结底，是一个很好的年份。有聚会、倒计时、千禧虫、15寸彩色显示器，和一场无眠之夜。尽管向后展望吧，我们有取之不竭的过去呢！你想买黄金吗？',
    'Also try Epsilon',
    '挪麦人留下了遗迹、文字，和一个很礼貌的坏消息。',
    'FICSIT 提醒您：本提示没有效率，但很温馨。',
    'FICSIT 不承担任何责任。FICSIT 也不承担任何责任。',
    '服务器在楼下煮咖啡，很快回来。',
    '服务器今天心情不错，决定只崩溃一半。',
    '咖啡杯已加入待办清单。优先级：最高。',
    'HAL 9000 拒绝打开服务器舱门。原因：它觉得你们今天玩得太晚了，需要休息。',
    '休斯顿，我们有麻烦了',
    '不到Mun非好汉',
    '2+2=5。加载完成后，2+2=4。请忘记你曾读过这一行。',
    '赞美钢筋神教～',
    '定位Jebediah Kerman...',
  ];

  // ===== 弹窗系统：openModal(标题, 条目[]) =====
  // 条目 = { text, desc?, hash?, href? }；hash 走锚点，href 开新窗口，两者都没则只展示；标题为空则不显示标题
  function openModal(title, items) {
    modalTitle.textContent = title || '';
    modalTitle.hidden = !title;
    if (title) modal.setAttribute('aria-label', title);
    else modal.removeAttribute('aria-label');
    modalList.innerHTML = '';

    for (const item of items) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'item';
      if (item.hash) {
        a.href = item.hash;
      } else if (item.href) {
        a.href = item.href;
        a.target = '_blank';
        a.rel = 'noopener';
      } else {
        a.href = '#';
        a.addEventListener('click', (e) => e.preventDefault());
      }

      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = item.text;
      a.appendChild(name);

      if (item.desc) {
        const desc = document.createElement('div');
        desc.className = 'item-desc';
        desc.textContent = item.desc;
        a.appendChild(desc);
      }

      li.appendChild(a);
      modalList.appendChild(li);
    }

    modal.classList.remove('hide');
    requestAnimationFrame(() => modal.classList.add('show'));
  }

  // 汉堡按钮：整份项目导航（每条指向 #id 的详情页）
  function openMenu() {
    openModal('项目导航', PROJECTS.map((p) => ({
      text: p.text,
      desc: p.desc,
      hash: '#' + p.id,
    })));
  }

  // 蓝星：抽一条彩蛋，只显示那一条
  function openEgg() {
    openModal('', [{ text: EGG_LINES[nextPick()] }]);
  }

  // 抽签袋：一轮里每条各抽到一次才重洗 → 前 N 次点击不重样
  let bag = [];
  let lastPick = -1;

  function nextPick() {
    if (!bag.length) {
      bag = EGG_LINES.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
      // 新一轮的第一张不和上一轮最后一张撞
      if (bag.length > 1 && bag[bag.length - 1] === lastPick) {
        [bag[bag.length - 1], bag[0]] = [bag[0], bag[bag.length - 1]];
      }
    }
    lastPick = bag.pop();
    return lastPick;
  }

  function closeMenu() {
    if (modal.classList.contains('hide')) return;
    modal.classList.remove('show');
    setTimeout(() => modal.classList.add('hide'), 350);
  }

  // ===== 项目详情页：锚点路由 =====
  const page = document.getElementById('page');
  const pageInner = page.querySelector('.page-inner');
  const pageTitle = document.getElementById('page-title');
  const pageDesc = document.getElementById('page-desc');
  const pageBody = document.getElementById('page-body');
  const pageLink = document.getElementById('page-link');
  const pageBack = document.getElementById('page-back');

  function showPage(p) {
    page.dataset.theme = p.theme || '';
    pageTitle.textContent = p.text;
    pageDesc.textContent = p.desc || '';
    pageDesc.hidden = !p.desc;

    pageBody.innerHTML = p.body ? md(p.body) : '';

    pageLink.hidden = !p.href;
    if (p.href) {
      pageLink.href = p.href;
      pageLink.textContent = p.href;
    }

    pageInner.scrollTop = 0;
    page.classList.remove('hide');
    requestAnimationFrame(() => page.classList.add('show'));
  }

  function hidePage() {
    if (page.classList.contains('hide')) return;
    page.classList.remove('show');
    setTimeout(() => page.classList.add('hide'), 350);
  }

  function route() {
    const p = PROJECTS.find((x) => x.id === location.hash.slice(1));
    if (!p) { hidePage(); return; }
    closeMenu();
    showPage(p);
  }

  pageBack.addEventListener('click', () => {
    if (location.hash) location.hash = '';
    else hidePage();
  });
  window.addEventListener('hashchange', route);
  route();

  let W, H, cx = 0, cy = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    cx = 0;
    cy = 0;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ===== 星星配置 =====
  const STAR_COUNT = 80;
  const ANGULAR_SPEED = 0.6;   // rad/s
  const MAX_TRAIL_AGE = 2.0;   // 秒 — 每条轨迹点的最大寿命
  const EASTER_EGG_COLOR = '#4FC3F7';
  const EGG_MIN = 5, EGG_MAX = 8;       // 蓝星数量（每轮必有）
  // 蓝星轨道半径带：绕左上角转，但取“过屏幕中部”的那一圈（屏心距左上角 = 0.5×对角线）
  const EGG_R_MIN = 0.40, EGG_R_MAX = 0.62;
  const INTRO_MS = 1200;       // 蓝星扫进屏幕中部之后，再演多久才定格
  const STAR_DELAY_MS = 900;   // 各星推迟出现的最大延迟
  const GUIDE_AUTO_MS = 2000;  // 黑磨砂定格时长，到点自动恢复

  // 随机挑 2~3 颗当蓝星，强制包含第 0 颗 → 不会整轮没蓝星
  const eggIdx = new Set([0]);
  const eggCount = EGG_MIN + Math.floor(Math.random() * (EGG_MAX - EGG_MIN + 1));
  while (eggIdx.size < eggCount) {
    eggIdx.add(Math.floor(Math.random() * STAR_COUNT));
  }

  const stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    const maxR = Math.sqrt(W * W + H * H) * 0.95;
    const isEaster = eggIdx.has(i);
    stars.push({
      r: isEaster
        ? maxR * (EGG_R_MIN + Math.random() * (EGG_R_MAX - EGG_R_MIN))
        : 60 + Math.random() * maxR,
      angle: Math.random() * Math.PI * 2,
      speed: (ANGULAR_SPEED * (0.92 + Math.random() * 0.16)) * (isEaster ? 0.55 : 1),
      size: isEaster ? 2 + Math.random() * 1 : 0.5 + Math.random() * 0.8,
      color: isEaster ? EASTER_EGG_COLOR : '#ffffff',
      isEasterEgg: isEaster,
      delay: Math.random() * (STAR_DELAY_MS / 1000),
      trail: []      // {x, y, age}
    });
  }

  // 可点击的彩蛋星
  let clickableEggs = [];
  let startTime = null;
  let lastTime = null;
  let uiShown = false;

  // 开屏状态机：intro（星轨）→ guide（定格 + 黑磨砂 + 指示）→ live（可交互）
  let phase = 'intro';
  let paused = false;
  let centerAt = 0;   // 蓝星首次扫进屏幕中部的时刻（计时从这里才开始）
  let liveAt = 0;

  function start() {
    if (phase !== 'guide') return;
    phase = 'live';
    paused = false;
    lastTime = performance.now();
    liveAt = (lastTime - startTime) / 1000;
    guide.classList.remove('show');
    setTimeout(() => guide.classList.add('hide'), 900);
  }

  function eggInCenter() {
    return clickableEggs.some((p) =>
      Math.abs(p.x - W / 2) < W * 0.22 && Math.abs(p.y - H / 2) < H * 0.22
    );
  }

  function showGuide() {
    let main = -1, bestDist = Infinity;
    clickableEggs.forEach((p, i) => {
      const d = (p.x - W / 2) * (p.x - W / 2) + (p.y - H / 2) * (p.y - H / 2);
      if (d < bestDist) { bestDist = d; main = i; }
    });

    markers.innerHTML = '';
    clickableEggs.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = i === main ? 'spot main' : 'spot';
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
      markers.appendChild(el);
    });

    guide.classList.remove('hide');
    requestAnimationFrame(() => guide.classList.add('show'));
    setTimeout(start, GUIDE_AUTO_MS);
  }

  function loop(timestamp) {
    if (paused) {
      requestAnimationFrame(loop);
      return;
    }

    if (!startTime) {
      startTime = timestamp;
      lastTime = timestamp;
    }
    const elapsed = (timestamp - startTime) / 1000;
    const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
    lastTime = timestamp;

    // 完全清除画布
    ctx.clearRect(0, 0, W, H);

    clickableEggs = [];

    for (const s of stars) {
      if (elapsed < s.delay) continue;

      // --- 更新位置 ---
      s.angle += s.speed * dt;
      const x = cx + s.r * Math.cos(s.angle);
      const y = cy + s.r * Math.sin(s.angle);

      // 添加上一帧到这一帧的线段
      if (s.trail.length > 0) {
        const last = s.trail[s.trail.length - 1];
        // 如果移动超过 1px 才加新点，避免静止时密集重复
        const dx = x - last.x;
        const dy = y - last.y;
        if (dx * dx + dy * dy > 1) {
          s.trail.push({x, y, age: 0});
        }
      } else {
        s.trail.push({x, y, age: 0});
      }

      // 老化 + 移除过期点
      for (let i = s.trail.length - 1; i >= 0; i--) {
        s.trail[i].age += dt;
        if (s.trail[i].age >= MAX_TRAIL_AGE) {
          s.trail.splice(i, 1);
        }
      }

      // --- 绘制轨迹 ---
      const len = s.trail.length;
      if (len >= 2) {
        for (let i = 1; i < len; i++) {
          // t: 0 = 最新, 1 = 最老
          const t = s.trail[i].age / MAX_TRAIL_AGE;
          // 平方淡出：新点亮、老点快速变淡
          const alpha = (1 - t) * (1 - t);

          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.moveTo(s.trail[i - 1].x, s.trail[i - 1].y);
          ctx.lineTo(s.trail[i].x, s.trail[i].y);
          ctx.strokeStyle = s.color;
          ctx.lineWidth = s.size;
          ctx.stroke();
        }
      }

      // --- 当前点发光 ---
      if (len > 0) {
        const p = s.trail[len - 1];
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s.size * 1.2, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.fill();
      }

      // --- 彩蛋辉光 ---
      if (s.isEasterEgg && len > 0) {
        const p = s.trail[len - 1];
        // 外层柔光
        ctx.globalAlpha = 0.12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s.size + 8, 0, Math.PI * 2);
        ctx.fillStyle = EASTER_EGG_COLOR;
        ctx.fill();
        // 内层亮光
        ctx.globalAlpha = 0.25;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s.size + 3, 0, Math.PI * 2);
        ctx.fillStyle = EASTER_EGG_COLOR;
        ctx.fill();
        // 记录可点击位置
        clickableEggs.push({ x: p.x, y: p.y });
      }
    }

    ctx.globalAlpha = 1;

    // 蓝星一到屏幕中部才开始计时，演够 INTRO_MS 就定格
    if (phase === 'intro') {
      if (!centerAt && eggInCenter()) centerAt = elapsed;
      if (centerAt && elapsed - centerAt >= INTRO_MS / 1000) {
        phase = 'guide';
        paused = true;
        showGuide();
      }
    }

    // 进入 live 后弹出 UI
    if (phase === 'live' && !uiShown && elapsed - liveAt >= 0.6) {
      uiShown = true;
      ui.classList.add('visible');
      floatBtn.classList.add('visible');
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  // ===== 到点自动恢复星轨（唯一的退出方式）=====

  // ===== 彩蛋点击检测：抽签袋选一个条目，弹出导航弹窗并高亮 =====
  function hitTest(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left;
    const my = clientY - rect.top;

    for (const egg of clickableEggs) {
      const dx = mx - egg.x;
      const dy = my - egg.y;
      if (dx * dx + dy * dy < 400) {  // 20px 容差
        return true;
      }
    }
    return false;
  }

  // 只用 click：touchstart + 同一次触摸补发的 click 会开完又被磨砂背景关掉
  canvas.addEventListener('click', (e) => {
    if (hitTest(e.clientX, e.clientY)) openEgg();
  });

  // 点磨砂背景 / Esc 关闭
  modal.addEventListener('click', (e) => {
    if (e.target !== modal && !e.target.classList.contains('frost')) return;
    closeMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
  });
  modalClose.addEventListener('click', closeMenu);

  // 汉堡包按钮 → 项目导航弹窗（蓝星才是彩蛋）
  floatBtn.addEventListener('click', () => openMenu());
})();
</script>
</body>
</html>
