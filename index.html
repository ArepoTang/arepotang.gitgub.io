<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TENET</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, 'Helvetica Neue', 'PingFang SC', 'Noto Sans SC', sans-serif;
  -webkit-font-smoothing: antialiased;
}
#canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ===== UI 左下角堆叠（右边界给右下角按钮让位，窄屏就换行变高）===== */
#ui {
  position: fixed;
  left: 24px;
  right: 96px;
  bottom: 28px;
  max-width: 420px;
  color: rgba(255,255,255,0.85);
  opacity: 0;
  transform: translateY(-12px);
  transition: opacity 0.8s ease-out 0.2s, transform 0.8s ease-out 0.2s;
  pointer-events: none;
  z-index: 10;
  user-select: none;
}
#ui.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
#ui .name {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 3px;
  margin-bottom: 5px;
  line-height: 1.2;
}
#ui .tagline {
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 1.5px;
  opacity: 0.5;
  margin-bottom: 0;
  line-height: 1.45;
  overflow-wrap: break-word;
}

/* ===== 悬浮按钮 右下角 ===== */
#float-btn {
  position: fixed;
  right: 22px;
  bottom: 22px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.05);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  cursor: pointer;
  opacity: 0;
  transform: translateY(-12px);
  transition:
    opacity 0.8s ease-out 0.3s,
    transform 0.8s ease-out 0.3s,
    background 0.3s,
    border-color 0.3s,
    box-shadow 0.3s;
  z-index: 10;
  pointer-events: none;
  padding: 0;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
#float-btn.visible {
  opacity: 0.5;
  transform: translateY(0);
  pointer-events: auto;
}
#float-btn:hover {
  opacity: 1 !important;
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.4);
  box-shadow: 0 0 20px rgba(255,255,255,0.08);
}
/* 汉堡包图标（三横）*/
#float-btn::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 16px;
  height: 1.5px;
  border-radius: 2px;
  background: rgba(255,255,255,0.7);
  box-shadow: 0 -5.5px 0 rgba(255,255,255,0.7), 0 5.5px 0 rgba(255,255,255,0.7);
  transform: translate(-50%, -50%);
  transition: background 0.3s, box-shadow 0.3s;
}
#float-btn:hover::after {
  background: rgba(255,255,255,0.95);
  box-shadow: 0 -5.5px 0 rgba(255,255,255,0.95), 0 5.5px 0 rgba(255,255,255,0.95);
}

/* ===== 磨砂弹窗（居中 + 右上角关闭）===== */
#modal {
  position: fixed;
  inset: 0;
  z-index: 30;
}
#modal.hide { display: none; }

#modal .modal-panel {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(420px, calc(100vw - 48px));
  max-height: min(72vh, 560px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 26px 24px 20px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(18,22,30,0.5);
  -webkit-backdrop-filter: blur(18px) saturate(0.9);
  backdrop-filter: blur(18px) saturate(0.9);
  box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.96);
  transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.2,.8,.25,1);
}
#modal.show .modal-panel {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

#modal-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  padding: 0;
  outline: none;
  cursor: pointer;
  transition: background 0.25s;
  -webkit-tap-highlight-color: transparent;
}
#modal-close::before,
#modal-close::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 13px;
  height: 1.5px;
  border-radius: 2px;
  background: rgba(255,255,255,0.6);
  transition: background 0.25s;
}
#modal-close::before { transform: translate(-50%, -50%) rotate(45deg); }
#modal-close::after  { transform: translate(-50%, -50%) rotate(-45deg); }
#modal-close:hover { background: rgba(255,255,255,0.08); }
#modal-close:hover::before,
#modal-close:hover::after { background: rgba(255,255,255,0.95); }

.modal-title {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 12px;
}
.modal-title[hidden] { display: none; }
#modal-list { list-style: none; }
#modal-list a {
  display: block;
  padding: 12px;
  margin: 0 -12px;
  border-radius: 12px;
  color: rgba(255,255,255,0.88);
  text-decoration: none;
  transition: background 0.25s;
}
#modal-list a:hover { background: rgba(79,195,247,0.1); }
#modal-list .item-name { font-size: 15px; letter-spacing: 0.5px; line-height: 1.6; white-space: pre-line; }
#modal-list .item-desc {
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,0.4);
  margin-top: 3px;
}

/* ===== 开屏引导：黑磨砂 + 蓝色星星指示 + 底部按钮 ===== */
#guide {
  position: fixed;
  inset: 0;
  z-index: 20;
}
#guide.hide { display: none; }

/* ===== 磨砂层（开屏引导 / 弹窗共用）===== */
.frost {
  position: absolute;
  inset: 0;
  background: rgba(3,5,9,0.62);
  -webkit-backdrop-filter: blur(16px) saturate(0.7);
  backdrop-filter: blur(16px) saturate(0.7);
  opacity: 0;
  transition: opacity 0.9s ease;
}
#guide.show .frost,
#modal.show .frost { opacity: 1; }
#modal .frost { transition-duration: 0.35s; }

#markers {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.9s ease 0.45s;
  pointer-events: none;
}
#guide.show #markers { opacity: 1; }

/* 蓝色星星指示点 */
.spot {
  position: absolute;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
}
.spot::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: #4FC3F7;
  box-shadow: 0 0 14px #4FC3F7, 0 0 34px rgba(79,195,247,0.75);
}
.spot::after {
  content: '';
  position: absolute;
  inset: -9px;
  border-radius: 50%;
  border: 1px solid rgba(79,195,247,0.6);
  animation: spotPulse 2.4s ease-out infinite;
}
@keyframes spotPulse {
  0%   { transform: scale(0.6); opacity: 0.9; }
  80%, 100% { transform: scale(2.4); opacity: 0; }
}
/* 主目标：离屏幕中心最近的那颗 */
.spot.main { width: 20px; height: 20px; margin: -10px 0 0 -10px; }
.spot.main::after { inset: -13px; border-color: rgba(79,195,247,0.85); }


/* ===== 项目详情页（锚点 #id）===== */
#page {
  position: fixed;
  inset: 0;
  z-index: 40;
}
#page.hide { display: none; }
#page .frost { transition-duration: 0.35s; }
#page.show .frost { opacity: 1; }

#page-back {
  position: absolute;
  z-index: 2;
  top: 18px;
  left: 18px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.75);
  font-size: 16px;
  line-height: 1;
  font-family: inherit;
  padding: 0;
  cursor: pointer;
  outline: none;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: background 0.25s, border-color 0.25s, color 0.25s;
  -webkit-tap-highlight-color: transparent;
}
#page-back:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.35);
  color: #fff;
}

.page-inner {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 88px 20px calc(44px + env(safe-area-inset-bottom, 0px));
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
#page.show .page-inner {
  opacity: 1;
  transform: none;
}
.page-card {
  position: relative;
  max-width: 620px;
  margin: 0 auto;
  padding: 30px 26px;
  animation: cardIn 0.45s cubic-bezier(.2,.8,.25,1);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
}

/* --- 纸板箱（phi）--- */
#page[data-theme="cardboard"] .page-card {
  border-radius: 4px;
  border: 1px solid rgba(84,58,32,0.35);
  background-image:
    repeating-linear-gradient(90deg, rgba(120,86,52,0.09) 0 1px, transparent 1px 7px),
    linear-gradient(160deg, #cfb086, #b8935f);
  box-shadow: 0 18px 40px rgba(0,0,0,0.5), inset 0 0 60px rgba(97,67,36,0.25);
  color: #4a3520;
}
#page[data-theme="cardboard"] .page-card::before {
  content: '';
  position: absolute;
  top: -13px;
  left: 50%;
  width: 96px;
  height: 26px;
  transform: translateX(-50%) rotate(-2deg);
  background: rgba(240,233,215,0.35);
  border-left: 1px dashed rgba(255,255,255,0.4);
  border-right: 1px dashed rgba(255,255,255,0.4);
}
#page[data-theme="cardboard"] #page-title { color: #38270f; }
#page[data-theme="cardboard"] #page-desc { color: rgba(56,39,15,0.6); }
#page[data-theme="cardboard"] #page-body { color: rgba(56,39,15,0.85); --line: rgba(56,39,15,0.28); --pick-bg: #3b2a17; --pick-fg: #f0e6d4; }
#page[data-theme="cardboard"] #page-link {
  border-color: rgba(56,39,15,0.4);
  background: rgba(255,255,255,0.28);
  color: #38270f;
}

/* --- 报纸（epsilon）--- */
#page[data-theme="newspaper"] .page-card {
  border-radius: 2px;
  background: linear-gradient(#f7f2e7, #ebe4d4);
  box-shadow: 0 18px 40px rgba(0,0,0,0.5);
  font-family: Georgia, 'Songti SC', 'Noto Serif SC', serif;
  color: #1c1a16;
}
#page[data-theme="newspaper"] .page-card::before {
  content: '';
  display: block;
  height: 6px;
  margin-bottom: 16px;
  border-top: 1px solid rgba(28,26,22,0.75);
  border-bottom: 1px solid rgba(28,26,22,0.75);
}
#page[data-theme="newspaper"] #page-title {
  padding-bottom: 12px;
  border-bottom: 3px double rgba(28,26,22,0.6);
  font-weight: 700;
  letter-spacing: 1px;
  color: #15130f;
}
#page[data-theme="newspaper"] #page-desc { color: rgba(28,26,22,0.6); }
#page[data-theme="newspaper"] #page-body { color: #2a261f; --line: rgba(28,26,22,0.3); --pick-bg: #1c1a16; --pick-fg: #f7f2e7; }
#page[data-theme="newspaper"] #page-link {
  border-color: rgba(28,26,22,0.35);
  background: rgba(28,26,22,0.05);
  color: #15130f;
}

/* --- 半调网罦（lambda）--- */
/* --- 半调网罦（lambda）：米白 + 深蓝 --- */
#page[data-theme="halftone"] .page-card {
  border-radius: 14px;
  border: 1px solid rgba(20,48,92,0.28);
  overflow: hidden;
  background-color: #f2ede1;
  background-image: radial-gradient(circle, rgba(20,48,92,0.15) 1px, transparent 1.35px);
  background-size: 6px 6px;
  box-shadow: 0 18px 44px rgba(0,0,0,0.45), inset 0 0 60px rgba(20,48,92,0.05);
  color: #14305c;
}
/* 顶部一条逼真的网屏：点大到点小再淡出 */
#page[data-theme="halftone"] .page-card::before {
  content: '';
  display: block;
  height: 54px;
  margin: -30px -26px 18px;
  border-bottom: 1px solid rgba(20,48,92,0.2);
  background-image:
    linear-gradient(to bottom, rgba(242,237,225,0), rgba(242,237,225,0.92)),
    radial-gradient(circle, #14305c 1.7px, transparent 2px);
  background-size: auto, 7px 7px;
}
/* 标题与小标题用网点填充（半调字），正文保持实色保证可读 */
#page[data-theme="halftone"] #page-title,
#page[data-theme="halftone"] #page-body h2,
#page[data-theme="halftone"] #page-body h3 {
  background-image: radial-gradient(circle, #14305c 1.1px, transparent 1.5px);
  background-size: 4px 4px;
  color: #14305c;
}
@supports (-webkit-background-clip: text) {
  #page[data-theme="halftone"] #page-title,
  #page[data-theme="halftone"] #page-body h2,
  #page[data-theme="halftone"] #page-body h3 {
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  /* 嵌套行内标签恢复实色，否则会继承成透明看不见 */
  #page[data-theme="halftone"] #page-title *,
  #page[data-theme="halftone"] #page-body h2 *,
  #page[data-theme="halftone"] #page-body h3 * {
    -webkit-text-fill-color: #14305c;
    color: #14305c;
  }
}
#page[data-theme="halftone"] #page-desc { color: rgba(20,48,92,0.6); }
#page[data-theme="halftone"] #page-body { color: rgba(20,48,92,0.85); --line: rgba(20,48,92,0.3); --pick-bg: #14305c; --pick-fg: #f2ede1; }
#page[data-theme="halftone"] #page-link {
  border-color: rgba(20,48,92,0.35);
  background: rgba(20,48,92,0.06);
  color: #14305c;
}
#page-title {
  font-size: 30px;
  font-weight: 600;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.92);
}
#page-desc {
  margin-top: 8px;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.45);
}
#page-desc[hidden] { display: none; }
#page-body { color: rgba(255,255,255,0.68); --line: rgba(255,255,255,0.22); --pick-bg: rgba(255,255,255,0.9); --pick-fg: #16181d; overflow-wrap: break-word; }
#page-body p {
  margin-top: 20px;
  font-size: 14px;
  font-weight: 300;
  line-height: 1.9;
}
#page-body h2 { margin: 28px 0 10px; font-size: 17px; font-weight: 600; letter-spacing: 1px; }
#page-body h3 { margin: 22px 0 8px; font-size: 15px; font-weight: 600; }
#page-body h4 { margin: 20px 0 8px; font-size: 14px; font-weight: 600; }
#page-body ul, #page-body ol { margin: 16px 0 0 22px; }
#page-body li { margin-top: 6px; font-size: 14px; font-weight: 300; line-height: 1.8; }
#page-body blockquote {
  margin-top: 18px;
  padding-left: 14px;
  border-left: 2px solid currentColor;
  opacity: 0.75;
}
#page-body code {
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(127,127,127,0.2);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.92em;
}
#page-body pre {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 8px;
  background: rgba(127,127,127,0.16);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
#page-body pre code {
  padding: 0;
  background: none;
  font-size: 12.5px;
  line-height: 1.7;
  white-space: pre;
}
#page-body hr {
  margin: 26px 0;
  border: 0;
  border-top: 1px solid currentColor;
  opacity: 0.25;
}
#page-body a { color: inherit; text-decoration: underline; }
#page-body strong { font-weight: 600; }
/* 正文里可以随手塞按钮 */
#page-body button, #page-body .btn {
  display: inline-block;
  margin-top: 16px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid currentColor;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 13px;
  line-height: 1.4;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.25s, opacity 0.25s;
}
#page-body button:hover, #page-body .btn:hover { background: rgba(127,127,127,0.16); }
/* 方案选择器：纯 CSS 子母菜单（滑块会同时动 left/width），改自 1.html */
#page-body .dl { margin-top: 16px; }
#page-body .dl input[type="radio"] { display: none; }
#page-body .switcher {
  position: relative;
  display: flex;
  width: 100%;
  max-width: 380px;
  height: 52px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(127,127,127,0.14);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.12);
}
#page-body .slider {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 0;
  height: calc(100% - 8px);
  border-radius: 999px;
  background: var(--pick-bg);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  opacity: 0;
  transition:
    left 0.45s cubic-bezier(0.25, 1, 0.5, 1),
    width 0.45s cubic-bezier(0.25, 1, 0.5, 1),
    opacity 0.3s ease;
  z-index: 1;
}
#page-body .left-group, #page-body .right-group { flex: 1; position: relative; z-index: 2; }
#page-body .main-label,
#page-body .sub-tab {
  position: absolute;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  color: inherit;
  opacity: 0.55;
  cursor: pointer;
  user-select: none;
  transition: color 0.3s, opacity 0.3s;
}
#page-body .main-label { left: 0; width: 100%; }
#page-body .left-group .sub-tab { width: 50%; font-size: 13px; }
#page-body .left-sub-a { left: 0; }
#page-body .left-sub-b { left: 50%; }
#page-body .left-sub-a, #page-body .left-sub-b { opacity: 0; pointer-events: none; }

/* 滑块位置：左侧两个子项各占 25%，右侧单项占 50% */
#dl-android:checked ~ .switcher .slider { opacity: 1; left: 4px; width: calc(25% - 2px); }
#dl-pc:checked ~ .switcher .slider { opacity: 1; left: calc(25% + 2px); width: calc(25% - 2px); }
#dl-portable:checked ~ .switcher .slider { opacity: 1; left: calc(50% + 1px); width: calc(50% - 5px); }

/* 展开：选中左组任一项时，左组由主标题换成两个子项 */
#dl-android:checked ~ .switcher .left-main,
#dl-pc:checked ~ .switcher .left-main { opacity: 0; pointer-events: none; }
#dl-android:checked ~ .switcher .left-sub-a,
#dl-android:checked ~ .switcher .left-sub-b,
#dl-pc:checked ~ .switcher .left-sub-a,
#dl-pc:checked ~ .switcher .left-sub-b { opacity: 1; pointer-events: auto; }

/* 选中项文字颜色 */
#dl-android:checked ~ .switcher .left-sub-a,
#dl-pc:checked ~ .switcher .left-sub-b,
#dl-portable:checked ~ .switcher .right-main { color: var(--pick-fg); opacity: 1; }

/* 下方文案：三段都在，只显示选中的那段 */
#page-body .seg-out { margin-top: 18px; }
#page-body .seg-out .out {
  display: none;
  font-size: 14px;
  font-weight: 300;
  line-height: 1.85;
}
#dl-android:checked ~ .seg-out .out[data-out="android"],
#dl-pc:checked ~ .seg-out .out[data-out="pc"],
#dl-portable:checked ~ .seg-out .out[data-out="portable"] { display: block; }
#page-body table {
  width: 100%;
  margin-top: 16px;
  border-collapse: collapse;
  font-size: 13px;
  font-weight: 300;
}
#page-body th, #page-body td {
  padding: 7px 9px;
  border: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
  line-height: 1.65;
}
#page-body th { font-weight: 600; }
#page-link {
  display: inline-block;
  margin-top: 28px;
  padding: 11px 20px;
  border-radius: 999px;
  border: 1px solid rgba(79,195,247,0.4);
  background: rgba(79,195,247,0.08);
  font-size: 13px;
  letter-spacing: 0.5px;
  color: #bfe6ff;
  text-decoration: none;
  word-break: break-all;
  transition: background 0.25s, border-color 0.25s;
}
#page-link:hover {

<h3>Phi 调参指南</h3>
<h4>一、操作流程</h4>
<ol><li>选择文件 —— Android 上走系统文件选择器</li><li>选方案 —— 上面那排 5 档切换器，左二右三</li><li>简单 / 复杂 —— 简单只露常用滑块；复杂把高级参数全摊开（顺便多出 YAML 存档）</li><li>生 成 —— 下面出图，图下一行字是这次处理的说明（耗时 / 尺寸）</li><li>保存图片 —— Android 弹系统「另存为」，自己挑目录</li></ol>
<h4>二、五个方案怎么选</h4>
<p>日漫是纯黑白（墨线 + 网点），所以它没有色板 / 色数；长边上限只有报纸那三档有。</p>
<h4>三、长边上限（报纸三档通用）</h4>
<p>max_side，复杂模式下能改，默认 2560，范围 640–4096。</p>
<p>处理前先把图缩到长边不超过它、算完再放大回原尺寸（出图尺寸不变，只是算法作用在小图上）。</p>
<p>手机上 2560 够用；要更细就 4096（慢 2–4 倍），只求快就 640–1600。它也会改变观感：同一个网点点距，在缩得更狠的图上点显得更大。</p>
<h4>四、日漫 / 美漫：墨线 + 网点</h4>
<p>这一套参数两个方案共用。</p>
<p>经验值：人像 T 30–40；细节多的风景 T 40–50；想要草稿感 T 20–25。</p>
<p>「墨线覆盖率异常」这个报错就是 T 或 R 没调好（见第十节）。</p>
<p>美漫额外的三个：</p>
<h4>五、平铺：色块 + 描边</h4>
<h4>六、半调网点（黑白 / RGB 共用）</h4>
<p>点距的一个细节：grid &lt; 10 时程序会先按比例放大图片再画点（否则圆画不圆），出图仍是原尺寸，只是更慢。</p>
<h4>七、色板（平铺 / 美漫，复杂模式下还能自定义）</h4>
<ul><li>auto 自适应：按图量化，色数由「色数」决定</li><li>morandi / pop / cool / earth / benday：五份固定色板（benday 是美漫本戴色）</li><li>自定义色板（复杂）：每行一个 #rrggbb。填了就不量化 —— 每个像素直接归到最近的颜色</li><li>从图抽色：用当前「色数」抽一份色板填进上面的框，可以再手改</li></ul>
<p>「色数」滑块的显隐跟着色板走：只有选 auto 时才露出来（其它几套色板颜色是固定写死的，色数不起作用）。</p>
<h4>八、存档：YAML</h4>
<p>复杂模式最下面的「导出 YAML / 导入 YAML」：</p>
<ul><li>导出 = 把当前全部参数（包括没露出来的）存成 poster.yaml，Android 上走系统下载</li><li>导入 = 把一份 YAML 灌回界面；不认识的键会告诉你哪些被忽略</li><li>换方案、换图都不用重调一遍，也方便把一套调好的参数贴给别人</li></ul>
<p>YAML 三个段：common（max_side）、poster（日漫/美漫/平铺那套）、halftone（网点那套），顶层还有 mode 和 palette。</p>
<h4>九、常见诉求 → 动哪个</h4>
<table><thead><tr><th>想要</th><th>怎么调</th></tr></thead><tbody><tr><td>更像老报纸</td><td>美漫：纸色 <code>#f2ead8</code> + 色板 benday + 暗点变暗 0.5；或半调黑白：点距 14–18 + <code>#ffeedd</code> 底</td></tr><tr><td>线条更干净</td><td>日漫：T 40–50、R 2；再把「网点留白」调小（80–85）少铺网点</td></tr><tr><td>网纹太规律 / 有摩尔纹</td><td>半调：抖动 0.25–0.4、角度换 15 或 75；别关预模糊</td></tr><tr><td>深色区有白缝</td><td>半调：勾「点覆盖格角」；美漫/平铺：色数调大一点</td></tr><tr><td>出图太灰、层次不清</td><td>调小「网点留白」（网点少一点）、明暗档数降到 3</td></tr><tr><td>出图太糊</td><td>长边上限调到 4096；半调把点距调小（&lt;10 会自动放大）</td></tr><tr><td>处理太慢</td><td>长边上限降到 1600 / 点距 ≥ 12 / 线粗 R 别用 4</td></tr></tbody></table>
<h4>十、报错都是什么</h4>
<p>生成图存在应用私有目录（/data/data/com.phi.io/files/app/.work/…），文件管理器里看不见，</p>
<p>所以要留图只能走「保存图片」；每次启动 App 会自动清掉上一轮留下的结果图。</p>`;

  // ===== 弹窗系统：openModal(标题, 条目[]) =====
  // 条目 = { text, desc?, hash?, href? }；hash 走锚点，href 开新窗口，两者都没则只展示；标题为空则不显示标题
  function openModal(title, items) {
    modalTitle.textContent = title || '';
    modalTitle.hidden = !title;
    if (title) modal.setAttribute('aria-label', title);
    else modal.removeAttribute('aria-label');
    modalList.innerHTML = '';

    for (const item of items) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'item';
      if (item.hash) {
        a.href = item.hash;
      } else if (item.href) {
        a.href = item.href;
        a.target = '_blank';
        a.rel = 'noopener';
      } else {
        a.href = '#';
        a.addEventListener('click', (e) => e.preventDefault());
      }

      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = item.text;
      a.appendChild(name);

      if (item.desc) {
        const desc = document.createElement('div');
        desc.className = 'item-desc';
        desc.textContent = item.desc;
        a.appendChild(desc);
      }

      li.appendChild(a);
      modalList.appendChild(li);
    }

    modal.classList.remove('hide');
    requestAnimationFrame(() => modal.classList.add('show'));
  }

  // 汉堡按钮：整份项目导航（每条指向 #id 的详情页）

      text: p.text,

      hash: '#' + p.id,

  // 蓝星：抽一条彩蛋，只显示那一条
  function openEgg() {
    openModal('', [{ text: EGG_LINES[nextPick()] }]);
  }

  // 抽签袋：一轮里每条各抽到一次才重洗 → 前 N 次点击不重样
  let bag = [];
  let lastPick = -1;

  function nextPick() {
    if (!bag.length) {
      bag = EGG_LINES.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
      // 新一轮的第一张不和上一轮最后一张撞
      if (bag.length > 1 && bag[bag.length - 1] === lastPick) {
        [bag[bag.length - 1], bag[0]] = [bag[0], bag[bag.length - 1]];
      }
    }
    lastPick = bag.pop();
    return lastPick;
  }

  function closeMenu() {

  pageBack.addEventListener('click', () => {
    if (location.hash) location.hash = '';
    hidePage();          // 不等 hashchange，立刻收
  });
  window.addEventListener('hashchange', route);
  route();

  let W, H, cx = 0, cy = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    cx = 0;
    cy = 0;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ===== 星星配置 =====
  const STAR_COUNT = 80;
  const ANGULAR_SPEED = 0.6;   // rad/s
  const MAX_TRAIL_AGE = 2.0;   // 秒 — 每条轨迹点的最大寿命
  const EASTER_EGG_COLOR = '#4FC3F7';
  const EGG_MIN = 5, EGG_MAX = 8;       // 蓝星数量（每轮必有）
  // 蓝星轨道半径带：绕左上角转，但取“过屏幕中部”的那一圈（屏心距左上角 = 0.5×对角线）
  const EGG_R_MIN = 0.40, EGG_R_MAX = 0.62;
  const INTRO_MS = 1200;       // 蓝星扫进屏幕中部之后，再演多久才定格
  const STAR_DELAY_MS = 900;   // 各星推迟出现的最大延迟
  const GUIDE_AUTO_MS = 2000;  // 黑磨砂定格时长，到点自动恢复

  // 随机挑 2~3 颗当蓝星，强制包含第 0 颗 → 不会整轮没蓝星
  const eggIdx = new Set([0]);
  const eggCount = EGG_MIN + Math.floor(Math.random() * (EGG_MAX - EGG_MIN + 1));
  while (eggIdx.size < eggCount) {
    eggIdx.add(Math.floor(Math.random() * STAR_COUNT));
  }

  const stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    const maxR = Math.sqrt(W * W + H * H) * 0.95;
    const isEaster = eggIdx.has(i);
    stars.push({
      r: isEaster
        ? maxR * (EGG_R_MIN + Math.random() * (EGG_R_MAX - EGG_R_MIN))
        : 60 + Math.random() * maxR,
      angle: Math.random() * Math.PI * 2,
      speed: (ANGULAR_SPEED * (0.92 + Math.random() * 0.16)) * (isEaster ? 0.55 : 1),
      size: isEaster ? 2 + Math.random() * 1 : 0.5 + Math.random() * 0.8,
      color: isEaster ? EASTER_EGG_COLOR : '#ffffff',
      isEasterEgg: isEaster,
      delay: Math.random() * (STAR_DELAY_MS / 1000),
      trail: []      // {x, y, age}
    });
  }

  // 可点击的彩蛋星
  let clickableEggs = [];
  let startTime = null;
  let lastTime = null;
  let uiShown = false;

  // 开屏状态机：intro（星轨）→ guide（定格 + 黑磨砂 + 指示）→ live（可交互）
  let phase = 'intro';
  let paused = false;
  let centerAt = 0;   // 蓝星首次扫进屏幕中部的时刻（计时从这里才开始）
  let liveAt = 0;

  function start() {
    if (phase !== 'guide') return;
    phase = 'live';
    paused = false;
    lastTime = performance.now();
    liveAt = (lastTime - startTime) / 1000;
    guide.classList.remove('show');
    setTimeout(() => guide.classList.add('hide'), 900);
  }

  function eggInCenter() {
    return clickableEggs.some((p) =>
      Math.abs(p.x - W / 2) < W * 0.22 && Math.abs(p.y - H / 2) < H * 0.22
    );
  }

  function showGuide() {
    let main = -1, bestDist = Infinity;
    clickableEggs.forEach((p, i) => {
      const d = (p.x - W / 2) * (p.x - W / 2) + (p.y - H / 2) * (p.y - H / 2);
      if (d < bestDist) { bestDist = d; main = i; }
    });

    markers.innerHTML = '';
    clickableEggs.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = i === main ? 'spot main' : 'spot';
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
      markers.appendChild(el);
    });

    guide.classList.remove('hide');
    requestAnimationFrame(() => guide.classList.add('show'));
    setTimeout(start, GUIDE_AUTO_MS);
  }

  function loop(timestamp) {
    if (paused) {
      requestAnimationFrame(loop);
      return;
    }

    if (!startTime) {
      startTime = timestamp;
      lastTime = timestamp;
    }
    const elapsed = (timestamp - startTime) / 1000;
    const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
    lastTime = timestamp;

    // 完全清除画布
    ctx.clearRect(0, 0, W, H);

    clickableEggs = [];

    for (const s of stars) {
      if (elapsed < s.delay) continue;

      // --- 更新位置 ---
      s.angle += s.speed * dt;
      const x = cx + s.r * Math.cos(s.angle);
      const y = cy + s.r * Math.sin(s.angle);

      // 添加上一帧到这一帧的线段
      if (s.trail.length > 0) {
        const last = s.trail[s.trail.length - 1];
        // 如果移动超过 1px 才加新点，避免静止时密集重复
        const dx = x - last.x;
        const dy = y - last.y;
        if (dx * dx + dy * dy > 1) {
          s.trail.push({x, y, age: 0});
        }
      } else {
        s.trail.push({x, y, age: 0});
      }

      // 老化 + 移除过期点
      for (let i = s.trail.length - 1; i >= 0; i--) {
        s.trail[i].age += dt;
        if (s.trail[i].age >= MAX_TRAIL_AGE) {
          s.trail.splice(i, 1);
        }
      }

      // --- 绘制轨迹 ---
      const len = s.trail.length;
      if (len >= 2) {
        for (let i = 1; i < len; i++) {
          // t: 0 = 最新, 1 = 最老
          const t = s.trail[i].age / MAX_TRAIL_AGE;
          // 平方淡出：新点亮、老点快速变淡
          const alpha = (1 - t) * (1 - t);

          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.moveTo(s.trail[i - 1].x, s.trail[i - 1].y);
          ctx.lineTo(s.trail[i].x, s.trail[i].y);
          ctx.strokeStyle = s.color;
          ctx.lineWidth = s.size;
          ctx.stroke();
        }
      }

      // --- 当前点发光 ---
      if (len > 0) {
        const p = s.trail[len - 1];
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s.size * 1.2, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.fill();
      }

      // --- 彩蛋辉光 ---
      if (s.isEasterEgg && len > 0) {
        const p = s.trail[len - 1];
        // 外层柔光
        ctx.globalAlpha = 0.12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s.size + 8, 0, Math.PI * 2);
        ctx.fillStyle = EASTER_EGG_COLOR;
        ctx.fill();
        // 内层亮光
        ctx.globalAlpha = 0.25;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s.size + 3, 0, Math.PI * 2);
        ctx.fillStyle = EASTER_EGG_COLOR;
        ctx.fill();
        // 记录可点击位置
        clickableEggs.push({ x: p.x, y: p.y });
      }
    }

    ctx.globalAlpha = 1;

    // 蓝星一到屏幕中部才开始计时，演够 INTRO_MS 就定格
    if (phase === 'intro') {
      if (!centerAt && eggInCenter()) centerAt = elapsed;
      if (centerAt && elapsed - centerAt >= INTRO_MS / 1000) {
        phase = 'guide';
        paused = true;
        showGuide();
      }
    }

    // 进入 live 后弹出 UI
    if (phase === 'live' && !uiShown && elapsed - liveAt >= 0.6) {
      uiShown = true;
      ui.classList.add('visible');
      floatBtn.classList.add('visible');
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  // ===== 到点自动恢复星轨（唯一的退出方式）=====

  // ===== 彩蛋点击检测：抽签袋选一个条目，弹出导航弹窗并高亮 =====
  function hitTest(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left;
    const my = clientY - rect.top;

    for (const egg of clickableEggs) {
      const dx = mx - egg.x;
      const dy = my - egg.y;
      if (dx * dx + dy * dy < 400) {  // 20px 容差
        return true;
      }
    }
    return false;
  }

  // 只用 click：touchstart + 同一次触摸补发的 click 会开完又被磨砂背景关掉
  canvas.addEventListener('click', (e) => {
    if (hitTest(e.clientX, e.clientY)) openEgg();
  });

  // 点磨砂背景 / Esc 关闭
  modal.addEventListener('click', (e) => {
    if (e.target !== modal && !e.target.classList.contains('frost')) return;
    closeMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
  });
  modalClose.addEventListener('click', closeMenu);

  // 汉堡包按钮 → 项目导航弹窗（蓝星才是彩蛋）
  floatBtn.addEventListener('click', () => openMenu());
})();
</script>
</body>
</html>
